name: Repository checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  service-and-security:
    name: Service and security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r service/requirements.lock
          python -m pip install pytest==9.1.1
      - name: Check publication boundaries
        run: python tools/verify_publication.py
      - name: Run model-free service and security tests
        run: python -m pytest tests -q
