# Voice AI Service configuration (copy to config.yaml and edit as needed).
# Relative paths resolve against the repository root. ${ENV} expansion is supported.
#
# COMPUTE MODEL
#   main   (audio.cpp)  - ASR + built-in voices; CPU by default, always running.
#   clone  (audio.cpp)  - zero-shot cloning only; GPU by default, started by the
#                         first cloning request and stopped after idle_stop_s, so
#                         the GPU is free for games and other local workloads.
#   llm    (llama.cpp)  - text correction/translation; gpu_layers 0 = CPU.
# Switch a block to the other device by pointing `binary` at the matching build
# and setting `backend` (cpu | cuda | vulkan).

service:
  host: 127.0.0.1        # keep loopback unless you really need LAN exposure
  port: 8080
  # Optional bearer auth. Add an `auth_token` field here, or export the
  # VOICE_SERVICE_AUTH_TOKEN environment variable before starting the service.
  allow_origins: []      # browser origins allowed to call the API (e.g. http://localhost:5173)
  max_upload_mb: 200

asr:
  default: nemotron      # nemotron (fastest measured, 0.41-0.46 RTF CPU) | whisper (timestamps)

tts:
  # auto routes by the text's script: Kokoro for English, piper-ru (male) or
  # piper-ru-female for Russian (both small, CPU, main process). The cloning
  # engine (OmniVoice Q8 via omnivoice.cpp) is used only when a cloned voice
  # profile is selected explicitly (voice=<profile-id>).
  default: auto
  # OmniVoice 0.6B Q8_0: ~945 MB, 600+ languages, much lighter than
  # qwen3-tts-clone (1.9 GB, ru/en only). Served by the omnivoice.cpp engine
  # (backends/omnivoice section below). Set to qwen3-tts-clone to use the
  # audio.cpp alternative instead (then also enable audiocpp_clone).
  clone_model: omnivoice-q8
  # Profile IDs from GET /v1/voices - or a built-in model id (e.g.
  # piper-ru-female) to choose the female Russian default voice.
  # Used only when a speech request omits both voice and a specific model;
  # explicit request values always win.
  default_voices:
    en: ""                # empty -> built-in English voice
    ru: ""                # e.g. piper-ru-female, or a cloned profile id

llm:
  enabled: true
  # skip_if_clean: true (default) returns correction-mode sentences unchanged
  # when the deterministic pre-pass found no dictionary near-miss and the spell
  # checker flagged nothing - the model is not called for them at all.
  # skip_if_clean: false

sessions:                # WebSocket dictation (/v1/sessions/dictation)
  vad_model: runtime/models/silero_vad.onnx
  speculative: true
  speech_threshold: 0.5
  silence_frames: 24     # 512-sample frames of silence (~0.77 s) to finalise an utterance
  min_speech_frames: 6
  preroll_frames: 11
  max_utterance_s: 30
  speculate_every_frames: 63

logging:
  transcripts: false     # privacy: transcript content is never written to logs by default
  level: info

backends:
  # ---------------------------------------------------------------- main (CPU)
  audiocpp:
    binary: runtime/bin/audiocpp-cpu/audiocpp_server.exe
    backend: cpu         # cuda | vulkan | cpu
    device: 0
    threads: 8
    host: 127.0.0.1
    port: 8101
    lazy_load: true
    idle_unload_ms: 90000   # audio.cpp unloads idle models itself
    max_loaded_models: 2
    start_timeout_s: 90
    idle_stop_s: 1800       # gateway stops the whole process after this idle time
    espeak_lib: runtime/third_party/espeak-ng/eSpeak NG/libespeak-ng.dll
    espeak_data: runtime/third_party/espeak-ng/eSpeak NG/espeak-ng-data
    voice_dir: runtime/voice-library   # zero-shot cloning profiles (see /v1/voices)
    models:
      # nemotron: 0.41-0.46 RTF on CPU (the fastest measured), punctuates in EN only.
      - id: nemotron
        family: nemotron_asr
        path: runtime/models/nemotron-3.5-asr-streaming-0.6b-q8_0.gguf
        task: asr
        mode: offline
        language: auto
      - id: kokoro            # English TTS (fast even on CPU)
        family: kokoro_tts
        path: runtime/models/kokoro-82m-q8_0.gguf
        task: tts
        mode: offline
        voice: af_heart
        language: en          # routing hint only (auto picks this for Latin text)
      - id: piper-ru          # Russian built-in voice (male), 62 MB, CPU
        family: piper_tts
        path: runtime/models/piper-ru-ruslan-medium.gguf
        task: tts
        mode: offline
        language: ru          # routing hint only (auto picks this for Cyrillic text)
        supports_language: false
      - id: piper-ru-female   # Russian built-in voice (female), 62 MB, CPU
        family: piper_tts
        path: runtime/models/piper-ru-irina-medium.gguf
        task: tts
        mode: offline
        language: ru
        supports_language: false

  # -------------------------------------------------- cloning engine (omnivoice)
  # k2-fsa omnivoice.cpp driving OmniVoice 0.6B Q8_0 (~945 MB total, 600+
  # languages, zero-shot cloning; weights CC-BY-NC 4.0 - download yourself, see
  # README "Models"). A stdin/stdout CLI supervised by the service
  # (service/voiceservice/backends/omnivoice.py): one warm child, one utterance
  # per input line, stopped after idle_stop_s. The `clone` compute group swaps
  # this binary between omnivoice-cpu and omnivoice-cuda builds (the CUDA build
  # makes cloned-voice TTS fast enough for real-time calls; the CPU build is
  # slow, RTF ~10-24 measured under load).
  # Model download (weights only; the engine builds from source, see README):
  #   HF Serveurperso/OmniVoice-GGUF -> omnivoice-base-Q8_0.gguf +
  #   omnivoice-tokenizer-Q8_0.gguf into runtime/models/omnivoice/
  omnivoice:
    enabled: true
    binary: runtime/bin/omnivoice-cpu/omnivoice-tts.exe
    codec_binary: runtime/bin/omnivoice-cpu/omnivoice-codec.exe
    backend: cpu          # bookkeeping for the compute switch (cpu | cuda)
    threads: 8
    steps: 32             # MaskGIT decode steps; fewer is faster, lower quality
    voice_dir: runtime/voice-library
    idle_stop_s: 300      # stop the child (frees ~1 GB RAM) when idle
    start_timeout_s: 120
    request_timeout_s: 600
    max_line_chars: 300
    models:
      - id: omnivoice-q8
        family: omnivoice
        path: runtime/models/omnivoice/omnivoice-base-Q8_0.gguf
        codec_path: runtime/models/omnivoice/omnivoice-tokenizer-Q8_0.gguf
        task: tts
        mode: offline
        language: auto

  # ------------------------------------------- alternative clone helper (audio.cpp)
  # The qwen3-tts-clone alternative (1.9 GB, ru/en + 8 languages, ~6.4 GB VRAM
  # peak on GPU). To switch: enable this, disable `omnivoice`, and set
  # tts.clone_model to qwen3-tts-clone.
  audiocpp_clone:
    enabled: false
    binary: runtime/bin/audiocpp-cuda/audiocpp_server.exe
    backend: cuda        # cpu | cuda | vulkan
    device: 0
    threads: 8
    host: 127.0.0.1
    port: 8104
    lazy_load: true
    idle_unload_ms: 60000
    max_loaded_models: 1
    start_timeout_s: 90
    idle_stop_s: 120     # stop the GPU process after 2 minutes without cloning
    voice_dir: runtime/voice-library
    models:
      - id: qwen3-tts-clone   # zero-shot voice cloning, ru/en + 8 languages
        family: qwen3_tts
        path: runtime/models/qwen3-tts-12hz-0.6b-base-q8_0.gguf
        task: tts
        mode: offline
        session_options:
          qwen3_tts.voice_prompt_cache_slots: "4"   # cache conditioning per profile

  whisper:
    enabled: true            # CPU; provides timestamped segments for file transcription
    binary: runtime/bin/whisper-cpu/Release/whisper-server.exe
    host: 127.0.0.1
    port: 8102
    model_path: runtime/models/ggml-small.bin   # swap to ggml-large-v3-turbo-q5_0.bin for better accuracy
    language: auto
    threads: 8
    idle_stop_s: 1800

  llama:
    # Text CORRECTION on the CPU. Default: the small GEC model (563 MB). The
    # service always sends enable_thinking=false, which this model needs
    # (thinking mode produced empty/wrong output - measured). Deterministic
    # pre-pass (dictionary near-misses + spell-checker REPLACE proposals) and
    # the llm.skip_if_clean gate run before the model, so clean sentences skip
    # it entirely.
    #
    # The service can either start this model itself (binary + model_path below)
    # or use a llama.cpp server you already run - an agent's model on the GPU,
    # for instance. Set `external: true`, point host/port at that server, and set
    # model_alias to the name it answers to. The service then adopts it while it
    # answers and never starts or stops it; if it is down, text processing fails
    # with a clear error instead of starting a second copy.
    external: false
    binary: runtime/bin/llama-vulkan/llama-server.exe
    variant_dirs: [runtime/bin/llama-cuda, runtime/bin/llama-vulkan]
    host: 127.0.0.1
    port: 8103
    model_path: runtime/models/Qwen3.5-0.8B-GEC-KAZ-RUS-ENG.Q4_0.gguf
    model_alias: gec-0.8b
    ctx_size: 8192
    gpu_layers: 0            # 0 = CPU only
    flash_attn: true
    threads: 8
    # Host-RAM prompt cache (llama-server --cache-ram). llama.cpp's default is
    # 8192 MiB; one dictation slot needs a few cached prompts at most. Set to
    # null to keep the llama.cpp default.
    cache_ram_mib: 512
    # KV cache storage: unset keeps f16. q8_0 for both halves KV memory
    # (about 0.56 GB less for this model at ctx_size 8192); measure quality
    # with tools/bench before switching. V quantization needs flash_attn.
    # cache_type_k: q8_0
    # cache_type_v: q8_0
    idle_stop_s: 300         # free RAM soon after a session ends

  # Dedicated TRANSLATION model: translation modes (translate_ru_en /
  # translate_en_ru) route here; correction stays on `llama`.
  # Base: PLaMo 3 Translate 0.8B Q4_K_M (573 MB) - verified in the full app flow
  # (docs/alternative-runtimes.md); template_style: plamo makes the service pass
  # context/glossary/target_lang as chat-template kwargs instead of a system turn.
  # Alternative: Hy-MT2-1.8B Q4_K_M (1.1 GB) - swap model_path/model_alias and
  # remove template_style. License note: PLaMo Community License (personal /
  # non-commercial free), Hy-MT2 Apache-2.0 code + check weight card.
  llama_translate:
    enabled: true
    binary: runtime/bin/llama-vulkan/llama-server.exe
    variant_dirs: [runtime/bin/llama-cuda, runtime/bin/llama-vulkan]
    host: 127.0.0.1
    port: 8106
    model_path: runtime/models/plamo-3-translate/plamo-3-translate-0.8b-Q4_K_M.gguf
    model_alias: plamo-3-translate-0.8b
    template_style: plamo
    ctx_size: 8192
    gpu_layers: 0
    flash_attn: true
    threads: 8
    cache_ram_mib: 512
    idle_stop_s: 300
